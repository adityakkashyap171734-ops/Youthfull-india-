name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: flutter create . --org com.youthfull --project-name youthfull_india --platforms android

      - name: Add Firebase packages
        run: flutter pub add firebase_core firebase_auth cloud_firestore google_sign_in

      - name: Setup Firebase and app code
        run: |
          cp google-services.json android/app/google-services.json
          cp app/Main.dart lib/main.dart
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          sed -i 's/id("com.android.application") version \(.*\) apply false/&\n    id("com.google.gms.google-services") version "4.4.2" apply false/' android/settings.gradle.kts
          sed -i 's/id("dev.flutter.flutter-gradle-plugin")/&\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
